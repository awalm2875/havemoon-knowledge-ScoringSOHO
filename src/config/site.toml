[config.site]
title = "Havemoon"
description = "Independent English guides and practical tools for sourcing products, verifying suppliers, managing manufacturing, and importing from China."
pageTitle = "Havemoon | China Sourcing & Manufacturing Knowledge Base"
pageDescription = "Practical, research-backed guidance for overseas buyers sourcing products and managing manufacturing in China."
url = "https://sohotation.xyz"
repository = ""
footerNote = "Independent educational content for overseas buyers and importers."

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "blue-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "en"

[config.fonts]
# 英文与代码感 UI 字体
en = "Arial"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search sourcing guides..."
maxResults = 8

[config.pages.blog]
title = "China Sourcing Guides"
kicker = ""
subtitle = "Practical guidance for finding suppliers, controlling quality, planning production, and importing from China."
note = "Every guide is written for a specific buyer decision and reviewed against primary sources where rules or compliance are involved."
postsPerPage = 10
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "card"

[config.pages.blog.categories]
title = "Guide Categories"
kicker = ""
subtitle = ""
note = "Browse the knowledge base by sourcing task."

[config.pages.blog.series]
title = "Learning Paths"
kicker = ""
subtitle = ""
note = "Connected guides arranged in a practical reading order."

[config.pages.projects]
title = "Buyer Resources"
kicker = ""
subtitle = "Guides, checklists, research notes, and import tools for practical sourcing work."
note = "Resources are grouped by purpose and include methodology or usage notes."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

